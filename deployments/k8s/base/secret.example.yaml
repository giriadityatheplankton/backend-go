# NOT included in kustomization.yaml. Create the real Secret with External Secrets /
# Sealed Secrets / your secret manager; never commit values.
apiVersion: v1
kind: Secret
metadata:
  name: backend-go-secrets
type: Opaque
stringData:
  DB_PRIMARY_DSN: "postgres://app:CHANGE_ME@primary.db.internal:5432/app?sslmode=verify-full"
  DB_REPLICA_DSNS: "postgres://app:CHANGE_ME@replica-0.db.internal:5432/app?sslmode=verify-full"
  REDIS_PASSWORD: "CHANGE_ME"
  REDIS_CACHE_PASSWORD: "CHANGE_ME"
  JWT_HMAC_SECRET: "CHANGE_ME_AT_LEAST_32_CHARACTERS_LONG"
