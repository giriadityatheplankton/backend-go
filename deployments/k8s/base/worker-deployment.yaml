# Outbox relay, stream consumers and reconciliation. Safe to run several replicas:
# the relay claims rows with FOR UPDATE SKIP LOCKED + leases, consumers share a group.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-go-worker
  labels:
    app.kubernetes.io/name: backend-go
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-go
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-go
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: backend-services
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: backend-go, app.kubernetes.io/component: worker }
      containers:
        - name: worker
          image: backend-go
          imagePullPolicy: IfNotPresent
          command: ["/app/worker"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { name: admin, containerPort: 9090 }
          envFrom:
            - configMapRef: { name: backend-go-config }
            - secretRef: { name: backend-go-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          lifecycle:
            preStop:
              sleep: { seconds: 3 }
          startupProbe:
            httpGet: { path: /healthz/ready, port: admin }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz/ready, port: admin }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz/live, port: admin }
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
