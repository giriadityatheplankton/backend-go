apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace and image are set per overlay. Pin prod by digest:
#   cd overlays/prod && kustomize edit set image backend-go=ghcr.io/<org>/backend-go@sha256:<digest>
resources:
  - configmap.yaml
  - api-deployment.yaml
  - worker-deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - job-migration.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: backend-services
    includeSelectors: false
