apiVersion: batch/v1
kind: Job
metadata:
  name: backend-go-migration
  labels:
    app.kubernetes.io/name: backend-go
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-go
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: migrator
          image: backend-go
          imagePullPolicy: IfNotPresent
          command: ["/app/migrate"]
          envFrom:
            - configMapRef:
                name: backend-go-config
            - secretRef:
                name: backend-go-secrets
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
